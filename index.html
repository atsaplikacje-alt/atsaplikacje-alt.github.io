<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amateur Team Sports</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#0b2342;--ink2:#4a5a70;--line:#dbe3ee;--acc:#1b5fa6}
@media (prefers-color-scheme:dark){:root{--bg:#081627;--card:#0f2238;--ink:#eef3f9;--ink2:#a9b8cb;--line:#1f3550;--acc:#8fc2ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px 56px}
header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.brand{font-weight:800;letter-spacing:.02em}
h1{font-size:28px;line-height:1.2;margin:18px 0 4px}
h2{font-size:19px;margin:26px 0 6px}
p{margin:0 0 12px}
.muted{color:var(--ink2);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 8px;margin-top:18px}
a{color:var(--acc)}
nav a{display:inline-block;margin:0 14px 8px 0;font-weight:600}
ol,ul{padding-left:22px;margin:0 0 12px}
li{margin-bottom:6px}
hr{border:0;border-top:1px solid var(--line);margin:34px 0}
.mail{font-weight:700;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<header><span class="brand">Amateur Team Sports</span></header>
<h1>Amateur Team Sports</h1>
<p class="muted">Strony informacyjne aplikacji ligi. / Information pages for the league apps.</p>
<div class="card">
<h2 style="margin-top:0">Amateur Team Sports Tennis</h2>
<p><a href="tennis/privacy/">Polityka prywatności / Privacy policy</a></p>
<p><a href="tennis/delete-account/">Usuwanie konta / Deleting your account</a></p>
</div>
<p class="muted" style="margin-top:22px">Kontakt / Contact: <span class="mail">atsaplikacje@gmail.com</span></p>
</main>
</body>
</html>
